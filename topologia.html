<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOC 360° · Topologia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='none' stroke='%23087E83' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23087E83'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="mapa.css">
</head>
<body class="topo-page">
<div class="grid-bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z"/><circle cx="16" cy="16" r="4"/></svg>
    <div>
      <h1>NOC <span>360°</span></h1>
      <p>Topologia da rede</p>
    </div>
  </div>
  <nav class="views" aria-label="Telas">
    <a href="index.html">Painel</a>
    <a href="topologia.html" class="on" aria-current="page">Topologia</a>
  </nav>
  <div class="topbar-right">
    <div class="clock" id="clock">--:--:--</div>
    <button type="button" class="icon" id="reload" title="Atualizar agora" aria-label="Atualizar agora">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
    </button>
    <button type="button" class="icon" id="fullscreen" title="Tela cheia (modo TV)" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<div class="ticker" id="ticker" aria-label="Problemas ativos em tempo real">
  <span class="ticker-label"><span class="led ok"></span>AO VIVO</span>
  <div class="ticker-track"><div class="ticker-move" id="tickerMove"></div></div>
</div>

<div class="mp-bar">
  <span class="mp-sum" id="mpSum">carregando…</span>
  <span class="mp-lg"><i style="background:var(--good)"></i>no ar <i style="background:var(--warning)"></i>com problema <i style="background:var(--critical)"></i>fora do ar <i style="background:#5598e7"></i>manutenção</span>
</div>
<main class="mp-stage" id="mpStage"></main>

<div class="mp-tip" id="mpTip" hidden></div>
<div class="mp-modal" id="mpModal" aria-hidden="true" role="dialog">
  <div class="mp-bg" id="mpBg"></div>
  <div class="mp-box"><div class="mp-hd" id="mpHd"></div><div class="mp-ct" id="mpCt"></div></div>
</div>

<script>
// com topology_url no config.php, a topologia é a de outro painel dentro desta moldura
fetch('api.php?action=topo', { cache: 'no-store' }).then((r) => r.json()).then((r) => { if (r && r.url) location.replace('topologia-embed.html'); }).catch(() => {});
</script>
<script src="ticker.js"></script>
<script src="mapa.js"></script>
</body>
</html>
