<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOC</title>
<style>
  /* ---- tokens: verde escuro (padrão) e claro (paleta de referência do skill dataviz) ---- */
  :root {
    color-scheme: dark;
    --page:#07130d; --surface:#0e2118; --surface2:#143024; --ink:#e8f2ec; --ink2:#b5cbbf;
    --muted:#7e9a8b; --grid:#1d382b; --axis:#2e4f3e; --border:rgba(255,255,255,.09);
    --good:#0ca30c; --good-text:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --warn-text:#fab219; --serious-text:#ec835a; --crit-text:#f0716f;
    --info:#3987e5; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#d55181;
    --sev0:#898781; --sev1:#3987e5; --sev2:#fab219; --sev3:#ec835a; --sev4:#d03b3b; --sev5:#e0457b;
    --on-sev:#0b0b0b; --accent:#1f7a52; --link:#6fd3a2;
    --side-bg:#0a1d14; --side-ink:#e6f1ea; --side-muted:#8fb0a0; --side-hover:#12302a; --side-line:rgba(255,255,255,.08);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --page:#f1f6f3; --surface:#ffffff; --surface2:#eef4f0; --ink:#0b1a12; --ink2:#47594f;
    --muted:#7a8c82; --grid:#e0e9e3; --axis:#c5d3ca; --border:rgba(11,26,18,.12);
    --good-text:#006300; --warn-text:#a56a00; --serious-text:#c2561f; --crit-text:#d03b3b;
    --info:#2a78d6; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#e87ba4;
    --sev1:#2a78d6; --sev5:#8f1d4a; --link:#1f7a52;
  }

  :root[data-theme="light"] :is(.card, .kpi, .gcard, .xsum > div, #tip) {
    color-scheme: dark;
    --surface:#0e2118; --surface2:#143024; --ink:#e8f2ec; --ink2:#b5cbbf;
    --muted:#7e9a8b; --grid:#1d382b; --axis:#2e4f3e; --border:rgba(255,255,255,.09);
    --good-text:#0ca30c; --warn-text:#fab219; --serious-text:#ec835a; --crit-text:#f0716f;
    --info:#3987e5; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#d55181;
    --sev1:#3987e5; --sev5:#e0457b; --link:#6fd3a2;
    color: var(--ink);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: linear-gradient(color-mix(in srgb, var(--page) 86%, transparent), color-mix(in srgb, var(--page) 86%, transparent)), url(/static/brand/fundo-painel.jpg) center / cover fixed, var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--link); }

  .app { display: grid; grid-template-columns: 310px 1fr; min-height: 100vh; }
  aside { background: var(--side-bg); color: var(--side-ink); border-right: 1px solid var(--side-line); position: sticky; top: 0;
          height: 100vh; display: flex; flex-direction: column; }
  .brand { padding: 18px 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; border-bottom: 1px solid var(--side-line); margin-bottom: 6px; }
  .brandlogo { width: 150px; max-width: 100%; height: auto; max-height: 104px; object-fit: contain; }
  .brandname { font-weight: 700; letter-spacing: 1.6px; font-size: 15px; color: var(--side-ink); }
  .brand small:empty { display: none; }
  .side-search { margin: 8px 14px; padding: 8px 10px; border: 1px solid var(--side-line); border-radius: 8px;
                 background: rgba(255,255,255,.06); color: var(--side-ink); width: calc(100% - 28px); }
  nav { overflow: auto; padding: 0 8px 16px; flex: 1; }
  .nav-title { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--side-muted); padding: 12px 10px 4px; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 8px; color: var(--side-ink);
              text-decoration: none; cursor: pointer; }
  .nav-item:hover { background: var(--side-hover); }
  .nav-item[aria-current="page"] { background: var(--side-hover); box-shadow: inset 3px 0 0 var(--link); font-weight: 600; }
  .nav-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .pc { font-size: 12px; color: var(--side-muted); font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.good { background: var(--good); } .dot.warn { background: var(--warn); }
  .dot.crit { background: var(--crit-text); border-radius: 2px; transform: rotate(45deg) scale(.85); }

  main { padding: 18px 24px 40px; min-width: 0; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; }
  .sub { color: var(--ink2); font-size: 13px; margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; color: var(--ink2); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 9px; cursor: pointer; }
  .btn:hover { background: var(--surface2); }
  .status { font-size: 12px; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
  .badge { background: #3a2b10; color: #fab219; border-radius: 999px; padding: 2px 9px; font-size: 12px; }

  .grid { display: grid; gap: 14px; margin-bottom: 14px; }
  .g6 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .card h2 { margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--ink2); }
  .card h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .section-title { font-size: 15px; font-weight: 650; margin: 22px 0 10px; }

  .gauge { text-align: center; padding: 10px 8px 12px; }
  .gauge svg { width: 100%; max-width: 230px; height: auto; display: block; margin: 0 auto; }
  .gauge .gl { font-size: 13px; color: var(--ink2); margin-top: 4px; }
  .gauge .gs { font-size: 12px; color: var(--muted); }

  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .kpi .l { font-size: 12px; color: var(--ink2); }
  .kpi .v { font-size: 26px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
  .kpi .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .v.good { color: var(--good-text); } .v.crit { color: var(--crit-text); } .v.warn { color: var(--warn-text); }

  .chart { width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ax text { fill: var(--muted); font-size: 11px; }
  .ax text.hlab { fill: var(--ink2); cursor: default; } .hstripe { fill: var(--surface2); opacity: .55; }
  .ax line, .gridline { stroke: var(--grid); }
  .baseline { stroke: var(--axis); }
  .bar { transition: opacity .1s; } .bar:hover, .cell:hover { opacity: .75; }
  .cell { stroke: var(--surface); stroke-width: 1.5; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink2); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .hb { display: grid; grid-template-columns: minmax(80px, 38%) 1fr auto; align-items: center; gap: 4px 10px; font-size: 13px; }
  .hb .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .hb .trk { background: var(--surface2); border-radius: 4px; height: 12px; position: relative; }
  .hb .fil { height: 12px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb .val { color: var(--ink2); font-variant-numeric: tabular-nums; text-align: right; }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }

  .donutwrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .donutwrap ul { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  .donutwrap li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  .donutwrap li b { margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select { background: var(--surface2); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  select option { background: var(--surface); color: var(--ink); }
  .tools input[type=search], .tools select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); }
  .tr-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 470px); gap: 16px; align-items: start; }
  .tr-ana { display: flex; flex-direction: column; gap: 10px; max-height: 330px; overflow: auto; } .tr-host { font-weight: 700; }
  .tr-c { border: 1px solid var(--border); border-left: 4px solid var(--good); border-radius: 10px; padding: 9px 12px; background: var(--surface2); }
  .tr-c.atencao { border-left-color: var(--warn); } .tr-c.risco { border-left-color: var(--crit); } .tr-c .h { font-weight: 700; margin-bottom: 6px; }
  .tr-c .g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; } .tr-c .g > div { display: flex; flex-direction: column; min-width: 0; }
  .tr-c .g span { color: var(--muted); font-size: 11px; } .tr-c .g b { font-size: 14px; } .tr-c .g small { color: var(--muted); font-size: 11px; } .tr-c p { margin: 8px 0 0; font-size: 12.5px; color: var(--ink2); }
  .tr-rh { font-size: 14px; margin: 16px 0 8px; } #trRank .tr-r { cursor: pointer; } #trRank .muted { color: var(--muted); }
  @media (max-width: 1000px) { .tr-wrap { grid-template-columns: 1fr; } .tr-ana { max-height: none; } }
  .tablewrap { overflow: auto; max-height: 560px; border: 1px solid var(--border); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { position: sticky; top: 0; background: var(--surface2); text-align: left; font-weight: 600; color: var(--ink2);
       padding: 8px 10px; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
  th.nosort { cursor: default; }
  th[aria-sort="ascending"]::after { content: " ▲"; font-size: 10px; } th[aria-sort="descending"]::after { content: " ▼"; font-size: 10px; }
  td { padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: middle; }
  td.wrap { white-space: normal; min-width: 240px; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--surface2); }
  a.hostlink { color: var(--ink); text-decoration: underline dotted; cursor: pointer; }

  .chip { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; color: var(--on-sev); }
  .sev0 { background: var(--sev0); } .sev1 { background: var(--sev1); color: #fff; } .sev2 { background: var(--sev2); }
  .sev3 { background: var(--sev3); } .sev4 { background: var(--sev4); color: #fff; } .sev5 { background: var(--sev5); color: #fff; }
  .st { display: inline-flex; align-items: center; gap: 6px; }
  .st i { font-style: normal; font-size: 11px; }
  .st.up i { color: var(--good-text); } .st.down { color: var(--crit-text); font-weight: 600; } .st.down i { color: var(--crit-text); }
  .st.maintenance i { color: var(--info); } .st.disabled { color: var(--muted); }
  .av-good { color: var(--good-text); } .av-warn { color: var(--warn-text); } .av-serious { color: var(--serious-text); } .av-crit { color: var(--crit-text); font-weight: 600; }
  .open { color: var(--crit-text); font-weight: 600; }

  /* visão geral: cartões de grupos */
  /* ---- visão executiva ---- */
  .g4 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .xc { display: flex; flex-direction: column; gap: 10px; }
  .xc h2 { display: flex; align-items: center; gap: 8px; margin: 0; }
  .xc h2 .tag { margin-left: auto; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: 650; text-transform: none; letter-spacing: 0; white-space: nowrap; }
  .tag.good { background: rgba(12,163,12,.16); color: var(--good-text); } .tag.warn { background: rgba(250,178,25,.16); color: var(--warn-text); }
  .tag.serious { background: rgba(236,131,90,.16); color: var(--serious-text); } .tag.crit { background: rgba(208,59,59,.2); color: var(--crit-text); }
  .tag.mut { background: var(--surface2); color: var(--muted); }
  .tag.info { background: rgba(57,135,229,.16); color: var(--info); }
  .xv { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .xv .big { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .xv .big small { font-size: 18px; font-weight: 500; color: var(--ink2); margin-left: 2px; }
  .xv .aside { font-size: 13px; font-weight: 600; color: var(--ink); }
  .xv .aside small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .pbar { position: relative; height: 8px; border-radius: 4px; background: var(--grid); }
  .pbar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .pbar b { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--ink); opacity: .8; border-radius: 1px; }
  .xcap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .xcap b { color: var(--ink); font-weight: 600; }
  .spark { height: 44px; margin: 0 -4px -6px; }
  .spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .xseg { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; background: var(--grid); }
  .xseg i { display: block; height: 100%; }
  .xseglg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); }
  .xseglg span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c); }
  .xseglg b { color: var(--ink); }
  .health { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
  .health .hm .l { font-size: 12px; color: var(--ink2); display: flex; justify-content: space-between; }
  .health .hm .v { font-size: 24px; font-weight: 650; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .health .hm .v small { font-size: 13px; color: var(--ink2); font-weight: 400; }
  .health .hm .s { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .xsum { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .xsum > div { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .xsum > div.on { box-shadow: inset 0 0 0 1px var(--c); }
  .xsum > div { display: flex; align-items: center; gap: 12px; }
  .xsum .xs-t { flex: 1; min-width: 0; }
  .xsum .xs-ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--c);
                 background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .xsum .xs-ic svg { width: 24px; height: 24px; }
  .xsum .l { font-size: 12px; color: var(--ink2); } .xsum .v { font-size: 24px; font-weight: 700; color: var(--c); } .xsum .s { font-size: 11px; color: var(--muted); }
  .gcard.xg { border-left: 4px solid var(--c, var(--border)); display: flex; flex-direction: column; gap: 9px; }
  .gcard.xg .gname { margin: 0; }
  .gcard.xg .gname .pct { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--c); flex: none; overflow: visible; }
  .gcard.xg dl { grid-template-columns: repeat(4, 1fr); gap: 2px 8px; border-top: 1px solid var(--border); padding-top: 8px; margin: 0; }
  .gcard.xg dt { font-size: 10px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); grid-row: 1; white-space: nowrap; }
  .gcard.xg dd { text-align: left; font-size: 13px; font-weight: 650; grid-row: 2; white-space: nowrap; }
  .gcard.xg dd.open { color: var(--crit-text); }
  .gcard.xg.na { opacity: .7; }
  /* ---- OAK IA ---- */
  .nav-ia { margin: 4px 0 2px; background: linear-gradient(135deg, rgba(31,122,82,.35), rgba(31,122,82,.12)); border: 1px solid rgba(111,211,162,.25); font-weight: 650; }
  .nav-ia img { height: 18px; width: auto; }
  .nav-ia .spark-ia { margin-left: auto; color: var(--link); }
  .iahero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: linear-gradient(135deg, #17332a, #122822) !important; border-color: #2a5245 !important; }
  .ialogo { height: 64px; width: auto; }
  .iabrain { width: 72px; height: 72px; flex: none; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #8ff0c4;
             background: radial-gradient(circle at 35% 30%, #2f8f6d 0%, #1b4d3b 55%, #10291f 100%); border: 1px solid rgba(143,240,196,.35);
             box-shadow: 0 0 0 4px rgba(76,197,154,.08), 0 0 24px rgba(76,197,154,.25), inset 0 1px 0 rgba(255,255,255,.08); }
.iabrain{position:relative;isolation:isolate;animation:iapulse 2.4s ease-in-out infinite}
.iabrain::before,.iabrain::after{content:"";position:absolute;inset:-1px;border-radius:19px;border:2px solid rgba(143,240,196,.7);opacity:0;pointer-events:none;animation:iaring 2.4s ease-out infinite;z-index:-1}
.iabrain::after{animation-delay:1.2s}
.iabrain svg{width:44px;height:44px;animation:iaglow 2.4s ease-in-out infinite !important;transform-origin:center}
@keyframes iapulse{0%,100%{box-shadow:0 0 0 4px rgba(76,197,154,.08),0 0 16px rgba(76,197,154,.22),inset 0 1px 0 rgba(255,255,255,.08)}
  50%{box-shadow:0 0 0 7px rgba(76,197,154,.2),0 0 42px rgba(76,197,154,.65),inset 0 0 18px rgba(143,240,196,.25)}}
@keyframes iaring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.45);opacity:0}}
@keyframes iaglow{0%,100%{color:#8ff0c4;filter:drop-shadow(0 0 4px rgba(143,240,196,.5));transform:scale(1)}
  50%{color:#d6fff0;filter:drop-shadow(0 0 10px rgba(143,240,196,.95)) drop-shadow(0 0 22px rgba(76,197,154,.7));transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.iabrain,.iabrain svg,.iabrain::before,.iabrain::after{animation:none !important}}
  .iah { flex: 1; min-width: 240px; } .iah h2 { margin: 0 !important; font-size: 22px !important; letter-spacing: .5px !important; text-transform: none !important; color: var(--ink) !important; }
  .iah h2::after { content: " ✦"; color: var(--link); font-size: 16px; } .iah p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .iameta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; color: var(--muted); text-align: right; }
  .iameta select { height: 32px; font-size: 12px; max-width: 320px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; }
  .iast { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; }
  .iast.estavel { background: rgba(12,163,12,.18); color: var(--good-text); } .iast.atencao { background: rgba(250,178,25,.18); color: var(--warn-text); } .iast.critico { background: rgba(208,59,59,.22); color: var(--crit-text); }
  .iares { font-size: 16px; line-height: 1.6; margin: 0; } .iares b { color: var(--link); }
  .iaold { background: #2a2614; border: 1px solid #6b5a22; color: #f0dfa8; border-radius: 10px; padding: 9px 14px; font-size: 13px; margin: 14px 0 0; display: flex; gap: 10px; align-items: center; }
  .iaold button { margin-left: auto; }
  .iainds { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .iaind .v { font-size: 24px; font-weight: 700; margin: 2px 0; } .iaind .d { font-size: 12px; font-weight: 600; }
  .iaind .d.good { color: var(--good-text); } .iaind .d.bad { color: var(--crit-text); } .iaind .d.neu { color: var(--muted); }
  .iachips { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 12px; }

const ago = ts => fmtDur(Date.now() / 1000 - ts);

function avClass(v, slo) { return v == null ? "" : v >= slo ? "av-good" : v >= 99 ? "av-warn" : v >= 95 ? "av-serious" : "av-crit"; }
function avVar(v, slo) { return v == null ? "var(--grid)" : v >= slo ? "var(--good)" : v >= 99 ? "var(--warn)" : v >= 95 ? "var(--serious)" : "var(--crit)"; }

/* ===================== tooltip ===================== */
const tip = $("#tip");
function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(Math.max(y - h - 10, 6), innerHeight - h - 6) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (t) showTip(t.getAttribute("data-tip"), e.clientX, e.clientY);
  else if (!e.target.closest || !e.target.closest(".hit")) hideTip();
});

/* ===================== gráficos SVG ===================== */
const bandColor = (v, bands) => { for (const [lim, c] of bands) if (v < lim) return c; return bands[bands.length - 1][1]; };
const availBands = slo => { const b = [[95, "crit"]]; if (slo > 99) b.push([99, "serious"]); b.push([slo, "warn"], [Infinity, "good"]); return b; };
const polar = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
function arc(cx, cy, r, a0, a1) {
  const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

/* Gauge: arco de 240°, anel fino com as faixas (bom/atenção/crítico) e marca de meta. */
function gauge(o) {
  const {value, min, max, bands, label, sub, unit = "%", dec = 2, target, tipExtra = ""} = o;
  const W = 220, H = 158, cx = 110, cy = 96, r = 74, A0 = -120, A1 = 120;
  const ang = v => A0 + (A1 - A0) * Math.min(1, Math.max(0, (v - min) / (max - min)));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}: ${value == null ? "sem dados" : nf(value, dec) + unit}">`;
  s += `<path d="${arc(cx, cy, r, A0, A1)}" fill="none" style="stroke:var(--grid)" stroke-width="14" stroke-linecap="round"/>`;
  // anel das faixas
  let prev = min;
  bands.forEach(([lim, c]) => {
    const hi = Math.min(lim, max);
    if (hi > prev) { s += `<path d="${arc(cx, cy, r + 13, ang(prev), ang(hi))}" fill="none" style="stroke:var(--${c})" stroke-width="3"/>`; prev = hi; }
  });
  if (value != null) {
    const col = bandColor(value, bands);
    if (value > min) s += `<path d="${arc(cx, cy, r, A0, ang(value))}" fill="none" style="stroke:var(--${col})" stroke-width="14" stroke-linecap="round"/>`;
  }
  if (target != null && target > min && target < max) {
    const [x0, y0] = polar(cx, cy, r - 12, ang(target)), [x1, y1] = polar(cx, cy, r + 17, ang(target));
    s += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" style="stroke:var(--ink)" stroke-width="2"/>`;
  }
  const txt = value == null ? "–" : nf(value, dec);
  s += `<text x="${cx}" y="${cy + 6}" text-anchor="middle" style="fill:var(--ink)" font-size="${txt.length > 6 ? 27 : 32}" font-weight="650">${txt}<tspan font-size="14" style="fill:var(--ink2)" font-weight="400">${value == null ? "" : unit}</tspan></text>`;
  const [lx, ly] = polar(cx, cy, r, A0), [rx, ry] = polar(cx, cy, r, A1);
  s += `<text x="${lx + 2}" y="${ly + 16}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${nf(min, min % 1 ? 1 : 0)}</text>`;
  s += `<text x="${rx - 2}" y="${ry + 16}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${nf(max, max % 1 ? 1 : 0)}</text>`;
  s += `</svg>`;
  return `<div class="card gauge"${o.dd ? ddAttr(o.dd) : ""} data-tip="${esc(`<b>${esc(label)}</b><br>${value == null ? "sem dados" : nf(value, dec) + unit}${target != null ? `<br>Meta: ${nf(target, 2)}${unit}` : ""}${tipExtra}`)}">${s}<div class="gl">${esc(label)}</div><div class="gs">${sub || "&nbsp;"}</div></div>`;
}

function niceTicks(min, max, n = 5) {
  if (max <= min) max = min + 1;
  const raw = (max - min) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function pickIdx(n, k) { if (n <= k) return [...Array(n).keys()]; const o = []; for (let i = 0; i < k; i++) o.push(Math.round(i * (n - 1) / (k - 1))); return [...new Set(o)]; }

/* Linha/pontos com hover (crosshair + tooltip). */
function lineChart(box, o) {
  const W = Math.max(320, box.clientWidth || 600), H = o.h || 240, m = {l: o.ml || 50, r: 14, t: 12, b: 26};
  const n = o.x.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const all = o.series.flatMap(s => s.vals).concat(o.band ? [...o.band.lo, ...o.band.hi] : []).filter(v => v != null);
  if (!n || !all.length) { box.innerHTML = '<div class="empty">Sem dados no período.</div>'; return; }
  let lo = o.ymin != null ? o.ymin : Math.min(...all), hi = o.ymax != null ? o.ymax : Math.max(...all);
  if (o.ref) { lo = Math.min(lo, o.ref.y); hi = Math.max(hi, o.ref.y); }
  if (hi === lo) hi = lo + 1;
  const px = i => m.l + (n === 1 ? iw / 2 : iw * i / (n - 1)), py = v => m.t + ih * (1 - (v - lo) / (hi - lo));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "gráfico")}">`;
  s += `<g class="ax">`;
  niceTicks(lo, hi, 4).forEach(t => { s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${py(t)}" y2="${py(t)}"/><text x="${m.l - 8}" y="${py(t) + 4}" text-anchor="end">${o.fmtY(t)}</text>`; });
  pickIdx(n, Math.max(2, Math.floor(iw / 70))).forEach(i => { s += `<text x="${px(i)}" y="${H - 7}" text-anchor="middle">${esc(o.xl[i])}</text>`; });
  s += `</g><line class="baseline" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  if (o.band) {
    let d = "", pts = [];
    o.band.hi.forEach((v, i) => { if (v != null) pts.push([px(i), py(v)]); });
    const lows = []; o.band.lo.forEach((v, i) => { if (v != null) lows.push([px(i), py(v)]); });
    d = "M" + pts.map(p => p.join(" ")).join("L") + "L" + lows.reverse().map(p => p.join(" ")).join("L") + "Z";
    s += `<path d="${d}" style="fill:var(--${o.band.color || "s1"})" opacity=".14"/>`;
  }
  if (o.ref) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${py(o.ref.y)}" y2="${py(o.ref.y)}" style="stroke:var(--ink2)" stroke-dasharray="5 4"/>`;
  o.series.forEach(se => {
    let d = "", pen = false;
    se.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + px(i).toFixed(1) + " " + py(v).toFixed(1); pen = true; });
    if (se.area) { const pts = se.vals.map((v, i) => v == null ? null : [px(i), py(v)]).filter(Boolean); if (pts.length) s += `<path d="M${pts[0][0]} ${m.t + ih}L${pts.map(p => p.join(" ")).join("L")}L${pts[pts.length - 1][0]} ${m.t + ih}Z" style="fill:var(--${se.color})" opacity=".13"/>`; }
    s += `<path d="${d}" fill="none" style="stroke:var(--${se.color})" stroke-width="2" stroke-linejoin="round" ${se.dash ? 'stroke-dasharray="4 3"' : ""}/>`;
    if (se.points) se.vals.forEach((v, i) => { if (v != null) s += `<circle cx="${px(i)}" cy="${py(v)}" r="4" style="fill:${se.pointColor ? se.pointColor(v) : "var(--" + se.color + ")"};stroke:var(--surface)" stroke-width="2"/>`; });
  });
  s += `<line class="cross" y1="${m.t}" y2="${m.t + ih}" style="stroke:var(--ink2);display:none" stroke-width="1"/>`;
  s += `<rect class="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  box.innerHTML = s;
  const hit = box.querySelector(".hit"), cross = box.querySelector(".cross");
  hit.addEventListener("mousemove", e => {
    const r = hit.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
    const i = Math.min(n - 1, Math.max(0, Math.round(f * (n - 1))));
    cross.setAttribute("x1", px(i)); cross.setAttribute("x2", px(i)); cross.style.display = "";
    showTip(o.tip(i), e.clientX, e.clientY);
  });
  hit.addEventListener("mouseleave", () => { cross.style.display = "none"; hideTip(); });
  if (o.dd) {  // clique no ponto: abre o detalhamento daquela janela
    hit.classList.add("clk");
    hit.addEventListener("click", e => { const r = hit.getBoundingClientRect(); openDrill(o.dd(Math.min(n - 1, Math.max(0, Math.round((e.clientX - r.left) / r.width * (n - 1)))))); });
  }
}

function fmtShort(s) {
  s = Math.round(s);
  if (s >= 86400) { const d = Math.floor(s / 86400), h = Math.round(s % 86400 / 3600); return h ? `${d}d${h}h` : `${d}d`; }
  if (s >= 3600) { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return m ? `${h}h${m}m` : `${h}h`; }
  return s >= 60 ? Math.round(s / 60) + "min" : s + "s";
}

/* Colunas a partir do zero; com o.label, o valor aparece no topo de cada barra (girado quando as barras são estreitas). */
function columnChart(box, o) {
  const W = Math.max(320, box.clientWidth || 600), H = o.h || 240, n = o.vals.length;
  const ml = o.ml || 50, bw0 = Math.max(2, (W - ml - 10) / n - 2), rot = !!o.label && bw0 < 34;
  const m = {l: ml, r: 10, t: o.label ? (rot ? 50 : 26) : 12, b: 26};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const mx = Math.max(...o.vals.filter(v => v != null), 0);
  if (!n || mx <= 0) { box.innerHTML = '<div class="empty">Nenhuma indisponibilidade no período 🎉</div>'; return; }
  const ticks = o.ticks ? o.ticks(mx) : niceTicks(0, mx, 4), top = Math.max(mx, ticks[ticks.length - 1]);
  const py = v => m.t + ih * (1 - v / top), bw = Math.max(2, iw / n - 2);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "gráfico")}"><g class="ax">`;
  ticks.forEach(t => { s += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${py(t)}" y2="${py(t)}"/><text x="${m.l - 8}" y="${py(t) + 4}" text-anchor="end">${o.fmtY(t)}</text>`; });
  pickIdx(n, Math.max(2, Math.floor(iw / 60))).forEach(i => { s += `<text x="${m.l + iw * (i + .5) / n}" y="${H - 7}" text-anchor="middle">${esc(o.xl[i])}</text>`; });
  s += `</g><line class="baseline" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  o.vals.forEach((v, i) => {
    if (!v) return;
    const x = m.l + iw * i / n + 1, y = py(v), h = m.t + ih - y, rr = Math.min(4, bw / 2, h);
    s += `<path class="bar" data-tip="${esc(o.tip(i))}" d="M${x} ${m.t + ih}V${y + rr}Q${x} ${y} ${x + rr} ${y}H${x + bw - rr}Q${x + bw} ${y} ${x + bw} ${y + rr}V${m.t + ih}Z" style="fill:var(--${o.color || "s2"})"/>`;
    if (o.label) {
      const cx = x + bw / 2, t = esc(o.label(v));
      s += rot ? `<text transform="translate(${cx + 3.5} ${y - 5}) rotate(-90)" font-size="10.5" style="fill:var(--ink2)">${t}</text>`
               : `<text x="${cx}" y="${y - 6}" text-anchor="middle" font-size="10.5" style="fill:var(--ink2)">${t}</text>`;
    }
  });
  if (o.dd) o.vals.forEach((v, i) => { if (v) s += `<rect class="colhit" x="${m.l + iw * i / n}" y="${m.t}" width="${iw / n}" height="${ih}" fill="transparent" data-tip="${esc(o.tip(i))}"${ddAttr(o.dd(i))}/>`; });
  box.innerHTML = s + "</svg>";
}

/* Mapa de calor: hosts × tempo, cor por faixa de disponibilidade (com legenda). */
function heatmap(box, o) {
  const rows = o.hosts, cols = o.buckets.length;
  if (!rows.length) { box.innerHTML = '<div class="empty">Sem hosts.</div>'; return; }
  const W = Math.max(480, box.clientWidth || 800), lab = Math.round(Math.min(280, Math.max(170, W * 0.24))), rh = 20, top = 22, rightPad = 8;
  const maxCh = Math.floor((lab - 16) / 6.4);  // quantas letras cabem na coluna de nomes (fonte 11px)
  const cw = (W - lab - rightPad) / cols, H = top + rows.length * rh + 4;
  const grid = {}; o.cells.forEach(([x, y, ...v]) => { grid[y * cols + x] = v.length > 1 ? v : v[0]; });
  // visão padrão = disponibilidade (%); outras visões passam cor, texto e clique próprios
  const color = o.color || (v => avVar(v, o.slo)), tipv = o.tipv || (v => `Disponibilidade: ${v == null ? "sem dados" : nf(v, 3) + "%"}`), clk = o.clickable || (v => v != null && v < 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Disponibilidade por host ao longo do período")}">`;
  rows.forEach((h, y) => { if (y % 2 === 0) s += `<rect class="hstripe" x="0" y="${top + y * rh}" width="${lab - 4}" height="${rh}" rx="3"/>`; });  // faixas para guiar a leitura
  s += `<g class="ax">`;
  pickIdx(cols, Math.max(2, Math.floor((W - lab) / 90))).forEach(i => { s += `<text x="${lab + cw * (i + .5)}" y="12" text-anchor="middle">${esc(o.xl[i])}</text>`; });
  rows.forEach((h0, y) => { const h = String(h0).replace(/\s+/g, " ").trim();  // nomes do Zabbix às vezes têm espaço duplo
    s += `<text class="hlab" x="4" y="${top + y * rh + 14}" text-anchor="start" data-tip="${esc(esc(h))}">${esc(h.length > maxCh ? h.slice(0, maxCh - 1).trimEnd() + "…" : h)}</text>`; });
  s += "</g>";
  rows.forEach((h, y) => {
    for (let x = 0; x < cols; x++) {
      const v = grid[y * cols + x];
      const t = `<b>${esc(h)}</b><br>${esc(o.tl[x])}<br>${tipv(v, x)}`, c = color(v, x);
      s += `<rect class="cell" data-tip="${esc(t)}"${o.dd && clk(v) ? ddAttr(o.dd(h, x)) : ""} x="${lab + x * cw}" y="${top + y * rh}" width="${Math.max(1, cw)}" height="${rh}" rx="2" style="fill:${typeof c === "string" ? c : c.fill}${c.op != null ? `;fill-opacity:${c.op}` : ""}"/>`;
    }
  });
  box.innerHTML = s + "</svg>";
}

function donut(box, items, total, centerLabel) {
  const R = 52, C = 2 * Math.PI * R;
  let off = 0, s = `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${esc(centerLabel)}"><circle cx="70" cy="70" r="${R}" fill="none" style="stroke:var(--grid)" stroke-width="16"/>`;
  items.forEach(it => {
    if (!it.v) return;
    const len = C * it.v / total;
    s += `<circle class="bar" data-tip="${esc(`<b>${esc(it.l)}</b><br>${it.v} hosts (${nf(100 * it.v / total, 1)}%)`)}"${it.dd ? ddAttr(it.dd) : ""} cx="70" cy="70" r="${R}" fill="none" style="stroke:var(--${it.c})" stroke-width="16" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len;
  });
  s += `<text x="70" y="68" text-anchor="middle" font-size="24" font-weight="650" style="fill:var(--ink)">${total}</text><text x="70" y="86" text-anchor="middle" font-size="11" style="fill:var(--ink2)">${esc(centerLabel)}</text></svg>`;
  box.innerHTML = `<div class="donutwrap">${s}<ul>${items.map(it => `<li${it.dd && it.v ? ddAttr(it.dd) : ""}><i style="width:10px;height:10px;border-radius:3px;background:var(--${it.c})"></i>${esc(it.l)}<b>${it.v}</b></li>`).join("")}</ul></div>`;
}

function hbars(rows, fmt, empty) {
  if (!rows.length) return `<div class="empty">${empty || "Sem dados."}</div>`;
  const mx = Math.max(...rows.map(r => r.v), 1e-9);
  return `<div class="hb">${rows.map(r => `<div class="hbr" style="display:contents"${r.dd && r.v ? ddAttr(r.dd) : ""}><span class="lab" title="${esc(r.l)}">${esc(r.l)}</span><span class="trk"><span class="fil" style="display:block;width:${Math.max(1, 100 * r.v / mx)}%;background:var(--${r.c || "s1"})"></span></span><span class="val">${fmt(r.v, r)}</span></div>`).join("")}</div>`;
}

/* ===================== logos dos clientes ===================== */
const dn = n => String(n).replace(/^\s*oakmont\s*[-–—:]\s*/i, "");
const slug = s => String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const GENERIC = new Set(["de", "da", "do", "das", "dos", "e", "cliente", "clientes", "oakmont", "grupo", "group"]);
function logoUrl(name) {
  const L = S.logos || {}, sl = slug(name);
  if (L[sl]) return L[sl];
  let best = null;
  for (const k in L) if (k.length >= 2 && ("-" + sl + "-").includes("-" + k + "-") && (!best || k.length > best.length)) best = k;
  return best ? L[best] : null;
}
function initials(name) {
  const w = slug(name).split("-").filter(x => x && !GENERIC.has(x));
  const a = w[0] || "?", b = w[1] || "";
  return (a[0] + (b[0] || a[1] || "")).toUpperCase();
}
function logoChip(name, size) {
  size = size || 26;
  const u = logoUrl(name);
  if (u) return `<span class="lg" style="width:${size}px;height:${size}px"><img src="${esc(u)}" alt="" loading="lazy"></span>`;
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<span class="lg ini" aria-hidden="true" style="width:${size}px;height:${size}px;background:hsl(${h} 32% 34%);font-size:${Math.round(size * .42)}px">${esc(initials(name))}</span>`;
}

/* ===================== exportação XLSX ===================== */
async function doExport(groups, period, sheets) {
  const r = await fetch(`/api/export.xlsx?groups=${encodeURIComponent(groups)}&period=${period}&sheets=${sheets}`);
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.erro || r.statusText); }
  const blob = await r.blob(), cd = r.headers.get("Content-Disposition") || "";
  const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)/i);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = m ? decodeURIComponent(m[1]) : "NOC-Oakmont.xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}
$("#expBtn").onclick = async () => {
  const b = $("#expBtn"), t = b.textContent; b.disabled = true; b.textContent = "Gerando…";
  try { await doExport(S.expTarget || "all", S.period, "resumo,hosts,incidentes,diario,sla"); }
  catch (e) { alert("Não foi possível exportar: " + e.message); }
  finally { b.disabled = false; b.textContent = t; }
};

function viewExport() {

  const sheetsDef = [["resumo", "Resumo por cliente", "disponibilidade, tempo fora, quedas, MTTR e problemas ativos"],

/* ===================== visão executiva: componentes ===================== */
const clamp01 = x => Math.max(0, Math.min(1, x));
function pbar(v, min, max, color, target) {
  const w = v == null ? 0 : 100 * clamp01((v - min) / (max - min));
  const t = target == null ? "" : `<b style="left:calc(${100 * clamp01((target - min) / (max - min))}% - 1px)"></b>`;
  return `<div class="pbar"><i style="width:${w}%;background:${color}"></i>${t}</div>`;
}
function sparkSvg(vals, color, ref, kind) {
  const v = vals.map(x => x == null ? null : +x), ok = v.filter(x => x != null);
  if (ok.length < 2) return "";
  let lo = Math.min(...ok, ref ?? Infinity), hi = Math.max(...ok, ref ?? -Infinity); if (hi === lo) { hi += 1; lo -= 1; }
  if (kind === "bar") lo = 0;
  const W = 200, H = 40, pad = 3, n = v.length, X = i => n === 1 ? W / 2 : pad + i * (W - 2 * pad) / (n - 1), Y = y => H - pad - (H - 2 * pad) * (y - lo) / (hi - lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  if (ref != null) s += `<line x1="0" x2="${W}" y1="${Y(ref)}" y2="${Y(ref)}" style="stroke:var(--warn)" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  if (kind === "bar") {  // cada barra dentro da sua fatia, para nao sair do card
    const slot = W / n, gap = Math.min(slot * 0.3, 6), bw = Math.max(1, slot - gap);
    v.forEach((y, i) => { if (y) s += `<rect x="${i * slot + gap / 2}" y="${Y(y)}" width="${bw}" height="${H - pad - Y(y)}" rx="1.5" style="fill:${color}" opacity=".85"/>`; });
  }
  else {
    const pts = v.map((y, i) => y == null ? null : [X(i), Y(y)]).filter(Boolean);
    s += `<path d="M${pts[0][0]} ${H}L${pts.map(p => p.join(" ")).join("L")}L${pts[pts.length - 1][0]} ${H}Z" style="fill:${color}" opacity=".13"/>`;
    s += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" style="stroke:${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  }
  return s + `</svg>`;
}
const avTag = (v, slo) => v == null ? `<span class="tag mut">Sem dados</span>` : v >= slo ? `<span class="tag good">Na meta</span>` : v >= 99 ? `<span class="tag warn">Atenção</span>` : v >= 95 ? `<span class="tag serious">Abaixo da meta</span>` : `<span class="tag crit">Crítico</span>`;
const lvl = (v, bands) => bandColor(v, bands);

      <div class="spark">${sparkSvg(d.series.avail, avVar(sm.avail, slo), slo)}</div></div>

      <div class="xseg">${[["up", "good", "Online"], ["maintenance", "info", "Manutenção"], ["down", "crit", "Fora"]].map(([k, c, l]) => st[k] ? `<i style="flex:${st[k]};background:var(--${c})" title="${l}: ${st[k]}"${ddAttr({kind: "hosts", state: k, title: `Hosts · ${l}`})}></i>` : "").join("")}</div>
      <div class="xseglg"><span style="--c:var(--good)">Online <b>${st.up}</b></span><span style="--c:var(--crit)">Fora <b>${st.down}</b></span><span style="--c:var(--info)">Manutenção <b>${st.maintenance}</b></span><span style="--c:var(--grid)">Desativados <b>${st.disabled}</b></span></div></div>
    <div class="card xc"${sm.problems_total ? ddAttr({kind: "problems", title: "Problemas ativos agora"}) : ""}>
      <h2>Problemas ativos ${crit ? `<span class="tag crit">${crit} críticos</span>` : `<span class="tag good">Sem críticos</span>`}</h2>

function hostTable(g) {
  const slo = g.slo, q = S.ui.search.toLowerCase();

  const k = S.ui.sortK, dir = S.ui.sortDir;
  const val = h => k === "name" ? h.name.toLowerCase() : k === "state" ? h.state : h[k] == null ? (dir > 0 ? Infinity : -Infinity) : h[k];
  rows.sort((a, b) => (val(a) < val(b) ? -1 : val(a) > val(b) ? 1 : 0) * dir);
  const th = (key, label, cls = "") => `<th class="${cls}" data-k="${key}" ${S.ui.sortK === key ? `aria-sort="${S.ui.sortDir > 0 ? "ascending" : "descending"}"` : ""}>${label}</th>`;
  const stl = {up: ["Online", "●"], down: ["Fora do ar", "▲"], maintenance: ["Manutenção", "◆"], disabled: ["Desativado", "○"]};

    const mc = (v, lim1, lim2) => v == null ? "–" : `<span class="${v >= lim2 ? "av-crit" : v >= lim1 ? "av-warn" : ""}">${nf(v, 1)}%</span>`;
    return `<tr><td><a class="hostlink"${ddAttr({kind: "hostcard", hostid: h.id, title: h.name})} title="Abrir a ficha do host">${esc(h.name)}</a></td>

      <td class="num ${avClass(h.avail, slo)}">${h.state === "disabled" ? "–" : fmtAv(h.avail)}</td><td class="num">${fmtDur(h.downtime)}</td><td class="num">${h.outages}</td><td class="num">${fmtDur(h.longest)}</td>

    const m = new Map();
    ev.forEach(i => { const k = i.hostid + "|" + i.name; let g = m.get(k);
      if (!g) m.set(k, g = {items: [], host: i.host, name: i.name, hostid: i.hostid, sev: 0, start: 0, end: 0, open: false, ack: false, down: 0, first: Infinity});
      g.items.push(i); g.sev = Math.max(g.sev, i.sev); g.down += Math.max(0, (i.end || now) - i.start); g.first = Math.min(g.first, i.start);
      if (i.end == null) g.open = true; if (i.ack) g.ack = true;
      if (i.start > g.start) { g.start = i.start; g.end = i.end; g.last = i; } });
    rows = [...m.values()].sort((a, b) => (b.open - a.open) || b.start - a.start);  // em aberto primeiro, depois os mais recentes
  } else rows = ev.map(i => ({items: [i], host: i.host, name: i.name, hostid: i.hostid, sev: i.sev, start: i.start, end: i.end, open: i.end == null, ack: i.ack, down: (i.end || now) - i.start, first: i.start, last: i}));
  const total = rows.length; INC_ROWS = rows.slice(0, S.ui.incMax);
  const body = INC_ROWS.map((r, ix) => { const n = r.items.length, lastEnd = r.open ? null : r.end;
    return `<tr data-inc="${ix}" tabindex="0" title="Clique para ver ${n > 1 ? "todas as ocorrências" : "os detalhes do alerta"}"><td>${fmtDT(r.start)}</td><td>${lastEnd ? fmtDT(lastEnd) : '<span class="open">em aberto</span>'}</td>
      <td class="num">${fmtDur((r.last.end || now) - r.last.start)}${n > 1 ? `<br><small class="sub">${fmtDur(r.down)} no total</small>` : ""}</td><td>${esc(r.host)}</td>
      <td class="wrap">${esc(r.name)}${n > 1 ? ` <span class="tag ${n >= 20 ? "warn" : "mut"}" title="Primeira vez: ${esc(fmtDT(r.first))}">${n}× no período</span>` : ""}</td>
      <td><span class="chip sev${r.sev}">${SEVN[r.sev]}</span></td><td>${r.ack ? "✔ sim" : "–"}</td></tr>`; }).join("");
  const label = S.ui.incGroup ? `${total} ${total === 1 ? "problema" : "problemas"} distintos · ${ev.length} ocorrências` : `${total} incidentes`;
  return `<div class="tablewrap"><table><thead><tr><th class="nosort">${S.ui.incGroup ? "Última ocorrência" : "Início"}</th><th class="nosort">Fim</th><th class="nosort num">Duração</th><th class="nosort">Host</th><th class="nosort">Problema</th><th class="nosort">Severidade</th><th class="nosort">Reconhecido</th></tr></thead><tbody>${body || `<tr><td colspan="7" class="empty">Nenhum incidente com esses filtros.</td></tr>`}</tbody></table></div>
    <div class="sub" style="margin-top:6px">${label}${total > INC_ROWS.length ? ` · mostrando ${INC_ROWS.length} <a href="#" id="moreInc">mostrar mais</a>` : ""}</div>`;
}

  async function drawTrend() {

    box.innerHTML = '<div class="loading">Calculando a tendência…</div>'; $("#trAna").innerHTML = ""; $("#trRank").innerHTML = ""; $("#trLeg").innerHTML = "";
    try {
      const host = S.ui.trendHost || "", r = await api(`/api/trendx?metric=${S.ui.trendMetric}&hours=${S.ui.trendHours}&group=${gid}&host=${host}`);
      if (!$("#cTrend")) return;
      const met = S.ui.trendMetric, u = r.unidade, pct = u === "%", dec = met === "ping" || met === "loss" ? 1 : 0, fm = v => v == null ? "–" : nf(v, dec) + u;
      const ser = r.series || []; if (!ser.length) { box.innerHTML = '<div class="empty">Sem dados desta métrica para a seleção.</div>'; return; }
      const base = ser.reduce((a, b2) => b2.pts.length > a.pts.length ? b2 : a, ser[0]).pts, idx = new Map(base.map((p, i) => [p.t, i]));
      const xl = base.map(p => S.ui.trendHours <= 72 ? fmtHour(p.t / 1000) : fmtDay(p.t / 1000));
      const align = (pts, k) => { const v = new Array(base.length).fill(null); pts.forEach(p => { const i = idx.get(p.t); if (i != null) v[i] = p[k]; }); return v; };
      const main = ser[0], an = main.analise || {}, cols = ["s1", "s3", "s2", "s4"];
      const line = a => a ? base.map((_, i) => a.ajuste_inicio + (a.ajuste_fim - a.ajuste_inicio) * (base.length > 1 ? i / (base.length - 1) : 0)) : null;
      const series = host ? ser.slice(0, 4).map((x, i) => ({name: x.nome, color: cols[i], vals: align(x.pts, "avg"), area: ser.length === 1 && i === 0}))
        : [{name: "Média do grupo", color: "s1", vals: align(main.pts, "avg")}];
      if (ser.length === 1 || !host) series.push({name: "Tendência", color: "s2", vals: line(an), dash: true});
      lineChart(box, {x: base, xl, h: 260, ml: 58, fmtY: fm, ymin: 0, ymax: pct ? 100 : null, aria: `Tendência de ${r.nome}`,
        ref: pct && met !== "loss" ? {y: 90, label: "90%"} : null,
        band: host ? null : {lo: align(main.pts, "min"), hi: align(main.pts, "max"), color: "s1"}, series,
        tip: i => `<b>${fmtDT(base[i].t / 1000)}</b>` + ser.slice(0, 4).map(x => { const v = align(x.pts, "avg")[i], mx = align(x.pts, "max")[i]; return `<div class="r"><span>${esc(x.nome)}</span><b>${fm(v)}</b></div>${host ? "" : `<div class="r"><span>pico entre os hosts</span><b>${fm(mx)}</b></div>`}`; }).join("")});
      $("#trLeg").innerHTML = series.map(x => `<span><i style="background:var(--${x.color})${x.dash ? ";height:2px" : ""}"></i>${esc(x.name)}</span>`).join("") + (host ? "" : '<span><i style="background:var(--s1);opacity:.25"></i>mínimo–máximo entre os hosts</span>') + (pct && met !== "loss" ? '<span><i style="background:var(--ink2);height:2px"></i>limite de 90%</span>' : "");
      // leitura da tendência (para cada série: até 4 volumes do disco)
      const per = met === "ping" ? " ms/dia" : " p.p./dia", dir = a => !a ? "–" : !a.confiavel ? "oscila, sem tendência clara" : Math.abs(a.inclinacao_dia * 30) < (pct ? 2 : 1) ? "estável" : a.inclinacao_dia > 0 ? "subindo" : "caindo";
      const cls = a => !a ? "" : a.dias_ate_90 != null && a.dias_ate_90 <= 30 ? "risco" : a.dias_ate_90 != null && a.dias_ate_90 <= 90 ? "atencao" : a.atual >= 90 ? "risco" : "melhora";
      const phrase = (x, a) => { if (!a) return ""; const quem = host ? `${esc(x.nome)}${met === "disk" ? "" : ""}` : `${esc(r.nome)} média do grupo`;
        let t = `<b>${quem}</b> em <b>${fm(a.atual)}</b> (média ${fm(a.media)}, pico ${fm(a.pico)}): ${dir(a)}`;
        if (a.confiavel && Math.abs(a.inclinacao_dia * 30) >= (pct ? 2 : 1)) t += `, ${a.inclinacao_dia > 0 ? "+" : ""}${nf(a.inclinacao_dia, 2)}${per}`;
        if (pct && a.dias_ate_90 === 0) t += ". <b>Já está acima de 90%.</b>"; else if (pct && a.dias_ate_90 != null) t += `. No ritmo atual chega a <b>90% em ~${nf(a.dias_ate_90, 0)} dias</b>${a.dias_ate_100 != null ? ` e a 100% em ~${nf(a.dias_ate_100, 0)} dias` : ""}.`; else t += ".";
        return t; };
      const card = (x, a) => !a ? "" : `<div class="tr-c ${cls(a)}"><div class="h">${esc(x.nome)}</div>
          <div class="g"><div><span>Atual</span><b>${fm(a.atual)}</b></div><div><span>Média</span><b>${fm(a.media)}</b></div><div><span>Pico</span><b>${fm(a.pico)}</b></div><div><span>P95</span><b>${fm(a.p95)}</b></div>
          <div><span>Tendência</span><b>${a.confiavel ? dir(a) : "sem padrão"}</b><small>${a.inclinacao_dia > 0 ? "+" : ""}${nf(a.inclinacao_dia, 2)}${per} · R² ${nf(a.r2, 2)}</small></div>
          <div><span>Projeção 30 dias</span><b>${a.confiavel ? fm(a.projecao_30d) : "–"}</b><small>${a.confiavel ? "pela reta de tendência" : "variação sem padrão"}</small></div>
          ${pct ? `<div><span>Atinge 90%</span><b>${a.dias_ate_90 === 0 ? "já passou" : a.dias_ate_90 != null ? "~" + nf(a.dias_ate_90, 0) + " dias" : "não no ritmo atual"}</b></div>` : ""}</div><p>${phrase(x, a)}</p></div>`;
      $("#trAna").innerHTML = `${r.host ? `<div class="tr-host">${esc(r.host)}</div>` : ""}${ser.slice(0, host ? 4 : 1).map(x => card(x, x.analise)).join("")}`;
      // ranking: hosts / volumes que mais preocupam (só na visão do grupo)
      const rk = main.ranking || [];
      if (!host && rk.length) $("#trRank").innerHTML = `<h3 class="tr-rh">Quem mais pesa na tendência <span class="hint">ordenado pela projeção de 30 dias · clique para analisar o host</span></h3>
        <div class="tablewrap"><table><thead><tr><th class="nosort">Host</th>${met === "disk" ? '<th class="nosort">Volume</th>' : ""}<th class="nosort num">Atual</th><th class="nosort num">Pico</th><th class="nosort">Tendência</th><th class="nosort num">Projeção 30 dias</th>${pct ? '<th class="nosort num">Atinge 90%</th>' : ""}</tr></thead><tbody>
        ${rk.map(x => `<tr class="tr-r" data-host="${esc(x.hostid)}"><td><b>${esc(x.host)}</b></td>${met === "disk" ? `<td>${esc(x.volume)}</td>` : ""}<td class="num">${fm(x.atual)}</td><td class="num">${fm(x.pico)}</td>
          <td>${x.confiavel ? `${x.inclinacao_dia > 0 ? "▲" : "▼"} ${nf(Math.abs(x.inclinacao_dia), 2)}${per}` : '<span class="muted">sem tendência clara</span>'}</td><td class="num">${x.confiavel ? fm(x.projecao_30d) : "–"}</td>
          ${pct ? `<td class="num">${x.dias_ate_90 === 0 ? '<span class="si-badge late">já passou</span>' : x.dias_ate_90 != null ? `<span class="${x.dias_ate_90 <= 30 ? "open" : ""}">~${nf(x.dias_ate_90, 0)} dias</span>` : "–"}</td>` : ""}</tr>`).join("")}</tbody></table></div>`;
      document.querySelectorAll("#trRank .tr-r").forEach(tr => tr.onclick = () => { S.ui.trendHost = tr.dataset.host; if ($("#trHost")) $("#trHost").value = tr.dataset.host; drawTrend(); });
    } catch (e) { box.innerHTML = `<div class="empty">Sem dados de tendência (${esc(e.message)}).</div>`; }
  }
  $("#trHost").onchange = e => { S.ui.trendHost = e.target.value; drawTrend(); };
  $("#trMetric").onchange = e => { S.ui.trendMetric = e.target.value; drawTrend(); };
  /* mapa: "avail" = host fora do ar (base do SLA) · "sev" = tempo com alerta Alta/Desastre (ex.: serviço parado com o host no ar) */
  async function drawHeat() {
    const box = $("#cHeat"); if (!box) return;
    const mode = S.ui.hmMode = S.ui.hmMode || lsGet("hmMode") || "avail"; $("#hmMode").value = mode;
    const leg = (items) => items.map(([c, l, op]) => `<span><i style="background:${c}${op ? ";opacity:" + op : ""}"></i>${l}</span>`).join("");
    if (mode === "avail") {
      $("#hmTitle").textContent = "Mapa de disponibilidade por host";
      $("#hmHint").textContent = g.heatmap.hosts.length < sm.monitored ? `os ${g.heatmap.hosts.length} hosts com mais tempo fora` : "todos os hosts";
      $("#hmLeg").innerHTML = leg([["var(--good)", `≥ meta (${nf(slo, 2)}%)`], ["var(--warn)", "≥ 99%"], ["var(--serious)", "≥ 95%"], ["var(--crit)", "&lt; 95%"], ["var(--grid)", "sem dados"]]);
      heatmap(box, {hosts: g.heatmap.hosts, cells: g.heatmap.cells, buckets: g.buckets, xl: bucketLabels(g), tl: bucketTitles(g), slo,
        dd: (h, x) => ({kind: "outages", host: h, from: g.buckets[x].from, to: g.buckets[x].to, title: `Quedas · ${h}`, sub: "indisponibilidades do host nesta janela"})});
      return;
    }
    $("#hmTitle").textContent = "Mapa de problemas graves por host";
    $("#hmLeg").innerHTML = leg([["var(--good)", "sem Alta/Desastre"], ["var(--sev4)", "Alta"], ["var(--sev5)", "Desastre"], ["var(--sev4)", "cor mais fraca = pouco tempo na janela", .5], ["var(--grid)", "sem dados"]]);
    if (!box.querySelector("svg")) box.innerHTML = '<div class="loading">Buscando os alertas graves no Zabbix…</div>';
    let d; try { d = await api(`/api/group/${gid}/sevmap?period=${S.period}`); } catch (e) { box.innerHTML = `<div class="empty">Não foi possível montar o mapa (${esc(e.message)}).</div>`; return; }
    if (S.ui.hmMode !== "sev" || !document.body.contains(box)) return;
    const comProb = d.total.filter(t => t > 0).length;
    $("#hmHint").textContent = comProb ? `${comProb} ${comProb === 1 ? "host teve" : "hosts tiveram"} alertas graves no período` : "nenhum alerta grave no período";
    const bl = g.buckets.map(b => Math.max(1, Math.min(b.to, Date.now() / 1000) - b.from));
    heatmap(box, {hosts: d.hosts, cells: d.cells, buckets: g.buckets, xl: bucketLabels(g), tl: bucketTitles(g), aria: "Problemas graves por host ao longo do período",
      color: (v, x) => v == null ? "var(--grid)" : v[0] <= 0 ? "var(--good)" : {fill: v[1] >= 5 ? "var(--sev5)" : "var(--sev4)", op: (0.45 + 0.55 * Math.min(1, v[0] / bl[x])).toFixed(2)},
      tipv: v => v == null ? "sem dados" : v[0] <= 0 ? "Nenhum alerta Alta ou Desastre" : `Com alerta grave: <b>${fmtDur(v[0])}</b> (${SEVN[v[1]]})<br><small>clique para ver os alertas</small>`,
      clickable: v => v != null && v[0] > 0,
      dd: (h, x) => ({kind: "events", host: h, group: "", sev: "4,5", overlap: 1, from: g.buckets[x].from, to: g.buckets[x].to, title: `Alertas graves · ${h}`, sub: "Alta e Desastre ativos nesta janela"})});
  }
  $("#hmMode").onchange = e => { S.ui.hmMode = e.target.value; lsSet("hmMode", S.ui.hmMode); $("#cHeat").innerHTML = ""; drawHeat(); };
  $("#trHours").onchange = e => { S.ui.trendHours = +e.target.value; drawTrend(); };

  S.draw = [() => {
    drawSeries(g, "#cAvail", "#cDown", slo);
    donut($("#cState"), [["up", "Online", "good"], ["down", "Fora do ar", "crit"], ["maintenance", "Manutenção", "info"], ["disabled", "Desativados", "muted"]]
      .map(([k, l, c]) => ({l, v: st[k], c, dd: {kind: "hosts", state: k, title: `Hosts · ${l}`}})), sm.hosts, "hosts");
    drawHeat();
    drawSla(slaR.slas || []);
    drawTrend();
  }];
}

/* ===================== página: SLA ===================== */
async function viewSla() {

  let t = t0;
  [o1.frequency, o2.frequency].forEach(f => f.setValueAtTime(LO, t0));
  const ramp = (f, dt, exp) => { t += dt; [[o1, 1], [o2, 1.007]].forEach(([o, k]) => exp ? o.frequency.exponentialRampToValueAtTime(f * k, t) : o.frequency.linearRampToValueAtTime(f * k, t)); };
  plan.forEach(([kind, n]) => {
    for (let i = 0; i < n; i++) {
      if (kind === "wail") { ramp(HI, 1.35, true); ramp(HI * 0.985, 0.25); ramp(LO, 1.6, true); }
      else { ramp(HI * 0.93, 0.15); ramp(LO * 1.15, 0.17); }
    }
  });
  const end = t;
  out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(0.42, t0 + 0.12);
  out.gain.setValueAtTime(0.42, end - 0.3); out.gain.linearRampToValueAtTime(0, end);
  [o1, o2].forEach(o => { o.start(t0); o.stop(end + 0.05); });
  AL.sirenUntil = end; AL.sirenNodes = {osc: [o1, o2], out};
  return true;
}
function sirenStop() {
  const n = AL.sirenNodes, ctx = AL.ctx; if (!n || !ctx) return;
  const t = ctx.currentTime;
  n.out.gain.cancelScheduledValues(t); n.out.gain.setValueAtTime(n.out.gain.value, t); n.out.gain.linearRampToValueAtTime(0, t + 0.08);
  n.osc.forEach(o => { try { o.stop(t + 0.1); } catch (e) {} });
  AL.sirenNodes = null; AL.sirenUntil = 0;
}
function toast(html, cls = "", ms = 30000, onOpen = null) {
  const el = document.createElement("div"); el.className = "alert-toast " + cls + (onOpen ? " clk" : ""); el.innerHTML = html;
  if (onOpen) {  // clique no aviso abre os detalhes; o ✕ só fecha
    el.insertAdjacentHTML("beforeend", '<span class="hint">Clique para ver os detalhes</span><button class="tx" type="button" title="Fechar aviso" aria-label="Fechar aviso">✕</button>');
    el.setAttribute("role", "button"); el.tabIndex = 0;
    el.onclick = e => { if (!e.target.closest(".tx")) onOpen(); el.remove(); };
    el.onkeydown = e => { if (e.key === "Enter") el.click(); };
  } else el.onclick = () => el.remove();
  $("#alertStack").prepend(el);
  if (ms) setTimeout(() => el.remove(), ms);
  const old = [...$("#alertStack").children].filter(x => !x.dataset.keep); while (old.length > 6) old.pop().remove();
  return el;
}
/* Botão de som com 3 estados: desligado · ligado mas bloqueado pelo navegador · ativo */
/* Botão de som: ligado = cada alerta novo é falado · silenciado = nenhuma fala automática.
   O "bloqueado" vem da própria fala (o navegador segurando o áudio até um clique), não do motor da antiga sirene. */
function sndUI() {
  const b = $("#sndBtn"), blocked = AL.on && TTS.waiting;
  b.textContent = !AL.on ? "🔇 Ativar som" : blocked ? "⚠ Clique para liberar o som" : "🔔 Som ativo";
  b.title = !AL.on ? "Som desligado. Clique para ativar os alertas de voz e a voz da OAK IA." : blocked ? "O navegador está segurando o áudio até um clique na página." : "Alertas de voz ativos. Clique para silenciar.";
  b.classList.toggle("on", AL.on && !blocked); b.classList.toggle("blocked", !!blocked); b.setAttribute("aria-pressed", AL.on);
}
function dropUnlock() {}
$("#sndBtn").onclick = e => {
  e.stopPropagation();
  if (AL.on) {  // silenciar: para a fala na hora e descarta o que estava na fila
    AL.on = false; AL.pending = 0; AL.waiting = []; sayStop(); sirenStop();
    document.querySelectorAll(".alert-toast.unlock").forEach(t => t.remove()); TTS.waiting = false;
  } else {
    AL.on = true; audioCtx();
    say(window.VOZ_ATIVADA || "Alertas de voz ativados. Vou avisar sobre cada novo alerta do Zabbix.", true);  // outra página sobre este motor pode trocar a frase
  }
  sndUI();
};
/* "hoje, às 11:32" · "ontem, às 20:15" · "em 12 de outubro, às 08:05" (no fuso do painel) */
function quandoFalado(ts) {
  const tz = S.cfg ? S.cfg.timezone : undefined, day = t => new Date(t * 1000).toLocaleDateString("pt-BR", {timeZone: tz});
  const hora = new Date(ts * 1000).toLocaleTimeString("pt-BR", {timeZone: tz, hour: "2-digit", minute: "2-digit"}), now = Date.now() / 1000;
  if (day(ts) === day(now)) return `hoje, às ${hora}`;
  if (day(ts) === day(now - 86400)) return `ontem, às ${hora}`;
  return `em ${new Date(ts * 1000).toLocaleDateString("pt-BR", {timeZone: tz, day: "numeric", month: "long"})}, às ${hora}`;
}
/* telefone falado: DDD por extenso e o resto dígito a dígito, com pausas ("onze, nove nove nove cinco zero, quatro nove um três") */
function foneFalado(t) {
  const D = "zero um dois três quatro cinco seis sete oito nove".split(" "), U = ["", "um", "dois", "três", "quatro", "cinco", "seis", "sete", "oito", "nove"];
  const T = ["", "dez", "vinte", "trinta", "quarenta", "cinquenta", "sessenta", "setenta", "oitenta", "noventa"];
  const E = ["dez", "onze", "doze", "treze", "quatorze", "quinze", "dezesseis", "dezessete", "dezoito", "dezenove"];
  const dois = g => g[0] === "1" ? E[+g[1]] : T[+g[0]] + (g[1] === "0" ? "" : " e " + U[+g[1]]);
  return String(t).split(/[^\d]+/).filter(Boolean).map((g, i) => i === 0 && g.length === 2 ? dois(g) : g.split("").map(d => D[+d]).join(" ")).join(", ");
}
function alertSpeech(list) {
  const MAX = 3, a = [...list].sort((x, y) => y.sev - x.sev || y.clock - x.clock);
  const um = x => `Severidade ${SEVN[x.sev]}. Host ${x.host || "não identificado"}. Alerta: ${x.name}. Começou ${quandoFalado(x.clock)}.`;
  if (a.length === 1) return "Novo alerta no Zabbix. " + um(a[0]) + acionamento(a);
  const ord = ["Primeiro", "Segundo", "Terceiro"];
  return `Identifiquei ${a.length} alertas novos no Zabbix, do mais grave para o menos grave. ` +
    a.slice(0, MAX).map((x, i) => `${ord[i]}: ${um(x)}`).join(" ") +
    (a.length > MAX ? ` E mais ${a.length - MAX} ${a.length - MAX === 1 ? "alerta" : "alertas"}. Os detalhes estão no painel.` : "") + acionamento(a);
}
/* final do áudio: alertas Alta/Desastre de Sistemas Internos, ha-datacenter e Applications pedem acionar o responsável */
function acionamento(list) {
  const e = AL.escalation; if (!e || !e.name || !list.some(x => x.escalate)) return "";
  return ` Atenção: acionar o ${e.name} por e-mail, WhatsApp e ligação${e.phone ? `, no contato ${foneFalado(e.phone)}` : ""}.`;
}
async function pollAlerts() {
  if (AL.busy) return; AL.busy = true;
  try {
    const r = await api(`/api/alerts?period=${S.period}`), list = r.alerts || []; AL.escalation = r.escalation || null;
    // servidor ja tem dados mais novos que os da tela (Zabbix mudou): redesenha sem esperar o ciclo
    if (r.gen && S.gen && r.gen > S.gen && !document.getElementById("expGo")) render(true);
    if (AL.known === null) { AL.known = new Set(list.map(a => a.id)); return; }  // 1a carga: so memoriza
    const fresh = list.filter(a => !AL.known.has(a.id));
    fresh.forEach(a => AL.known.add(a.id));
    if (!fresh.length) return;
    const item = a => ({id: a.id, name: a.name, sev: a.sev, start: a.clock, end: null, dur: Math.max(0, Date.now() / 1000 - a.clock),
                        host: a.host, hostid: (a.hostids || [])[0], ack: a.ack});
    fresh.slice(0, 5).forEach(a => {
      const esc1 = a.escalate && AL.escalation ? `<br><small style="color:var(--crit-text);font-weight:600">📞 Acionar ${esc(AL.escalation.name)} (e-mail, WhatsApp e ligação)${AL.escalation.phone ? ": " + esc(AL.escalation.phone) : ""}</small>` : "";
      const el = toast(`<b><span class="chip sev${a.sev}">${SEVN[a.sev]}</span> ${esc(a.host || "—")}</b>${esc(a.name)}<br><small>${fmtDT(a.clock)}</small>${esc1}`, "", a.escalate ? 120000 : 30000,
        () => openDrill({kind: "problems", title: a.name, sub: `${a.host || ""} · alerta novo`, items: [item(a)], expand: true}));
      el.style.borderLeftColor = `var(--sev${a.sev})`;
    });
    if (fresh.length > 5) toast(`<b>+${fresh.length - 5} alertas novos</b>`, "", 30000,
      () => openDrill({kind: "problems", title: `${fresh.length} alertas novos`, sub: `chegaram às ${fmtHour(Date.now() / 1000)}`, items: fresh.map(item)}));
    document.body.classList.remove("alarm"); void document.body.offsetWidth; document.body.classList.add("alarm");
    if (AL.on) {  // no lugar da sirene: a voz anuncia severidade, host, tipo de alerta e início
      say(alertSpeech(fresh), true, true); sndUI();  // se o navegador segurar o áudio, a fala espera o primeiro clique
    }
  } catch (e) { /* tenta de novo na proxima rodada */ } finally { AL.busy = false; }
}
sndUI();

(async () => {
  try { S.cfg = await api("/api/config"); } catch (e) { $("#view").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if (!S.cfg.periods.some(p => p.id === S.period)) S.period = "30d";
  if (S.cfg.demo) { $("#demoTag").innerHTML = '<span class="badge">DEMONSTRAÇÃO</span>'; }
  buildPeriods();
  S.logos = (await api("/api/logos").catch(() => ({logos: {}}))).logos || {};
  await render(false);
  S.timer = setInterval(() => { if (!document.hidden) render(true); }, S.cfg.refresh_seconds * 1000);
  pollAlerts(); setInterval(pollAlerts, (S.cfg.alert_poll_seconds || 15) * 1000);
  if (AL.on) { audioCtx(); setTimeout(sndUI, 400); }
})();
</script>
