# O editor de texto do GLPI (TinyMCE) carrega o CSS da paleta personalizada por
# um endereço sem versão (sem "lastupdate"), que o GLPI manda guardar por 30 dias.
# Assim, mudanças na paleta não chegavam ao editor. Aqui esse endereço passa a
# ser revalidado sempre (são poucos KB).
# THE_REQUEST: o GLPI reescreve tudo para index.php, então o REQUEST_URI já chega mudado.
<If "%{THE_REQUEST} =~ m#^GET /front/css\\.php\\?\\S*is_custom_theme=1# && %{THE_REQUEST} !~ /lastupdate=/">
    Header set Cache-Control "no-cache"
    Header unset Expires
</If>
